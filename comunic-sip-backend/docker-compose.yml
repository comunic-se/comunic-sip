# Stack de PRODUÇÃO do Comunic.SIP (opção A): API + Postgres próprios.
# O proxy reverso que já existe no host (n8n/Vaultwarden) termina o TLS e
# encaminha o subdomínio para a API. Esta stack NÃO abre 80/443.
#
#   docker compose up -d --build
#
# Proxy em container (Nginx Proxy Manager, Traefik...): use também
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
#
# Desenvolvimento: use docker-compose.dev.yml (só o Postgres, em 127.0.0.1:5433).

services:
  api:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://comunic:${DB_PASSWORD:?defina DB_PASSWORD no .env}@db:5432/comunicsip
    # Só no loopback do host: quem atende a internet é o proxy.
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=128MB"]
    environment:
      POSTGRES_USER: comunic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: comunicsip
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem porta publicada: o banco só é alcançável pela rede interna da stack.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunic -d comunicsip"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
